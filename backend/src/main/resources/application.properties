spring.application.name=ecm
springdoc.api.docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.port=${SERVER_PORT:8090}
server.forward-headers-strategy=framework
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecm}
spring.datasource.username=${DATASOURCE_USERNAME:ecm}
spring.datasource.password=${DATASOURCE_PASSWORD:ecm}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.servlet.multipart.max-file-size=${ECM_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${ECM_MAX_FILE_SIZE:100MB}
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
ecm.admin.email=${ADMIN_EMAIL:admin@admin.com}
ecm.admin.password=${ADMIN_PASSWORD:}
ecm.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}
ecm.storage.root=${ECM_STORAGE_ROOT:./data/blobs}
ecm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
ecm.mail.from=${MAIL_FROM:}
mailing.activation-url=${APP_URL:http://localhost:4200}/activate
mailing.log-in-url=${APP_URL:http://localhost:4200}/login
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
ecm.search.index=${ECM_SEARCH_INDEX:ecm-documents}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.health.elasticsearch.enabled=false
