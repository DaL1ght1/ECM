spring.application.name=/* project name */
springdoc.api.docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.port=${SERVER_PORT:8090}
spring.datasource.username=${DATASOURCE_USERNAME:/* DataBase username */}
spring.datasource.password=${DATASOURCE_PASSWORD:DataBase Password}
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ /*Project Name*/  ?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.sql.init.mode=always
spring.liquibase.enabled=false
setting.app-info.build-version=1.0
# Base64, at least 32 bytes. Generate with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
ecm.admin.email=${ADMIN_EMAIL:admin@admin.com}
ecm.admin.password=${ADMIN_PASSWORD:}
ecm.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}
file.upload-dir= /* Download Directory relative path */
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= /*Email to send mails*/
spring.mail.password= /*Password*/
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mailing.activation-url= /*FrontEnd Activate account page path*/
mailing.log-in-url= /*frontEnd signIn page Path*/
path.base= /* Download Directory absolute path */
