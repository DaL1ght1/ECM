spring.application.name=/* project name */
springdoc.api.docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.port=${SERVER_PORT:8090}
spring.datasource.username=${DATASOURCE_USERNAME:/* DataBase username */}
spring.datasource.password=${DATASOURCE_PASSWORD:DataBase Password}
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ /*Project Name*/  ?createDatabaseIfNotExist=true}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.servlet.multipart.max-file-size=${ECM_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${ECM_MAX_FILE_SIZE:100MB}
setting.app-info.build-version=1.0
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=15m
jwt.refresh-token-ttl=7d
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
ecm.admin.email=${ADMIN_EMAIL:admin@admin.com}
ecm.admin.password=${ADMIN_PASSWORD:}
ecm.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}
ecm.storage.root=${ECM_STORAGE_ROOT:./data/blobs}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= /*Email to send mails*/
spring.mail.password= /*Password*/
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mailing.activation-url= /*FrontEnd Activate account page path*/
mailing.log-in-url= /*frontEnd signIn page Path*/
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
ecm.search.index=${ECM_SEARCH_INDEX:ecm-documents}
