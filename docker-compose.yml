name: ecm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecm
      POSTGRES_USER: ${POSTGRES_USER:-ecm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecm
      DATASOURCE_USERNAME: ${POSTGRES_USER:-ecm}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
      ECM_MAX_FILE_SIZE: ${ECM_MAX_FILE_SIZE:-100MB}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${ECM_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: ["tools"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
  blobs:
